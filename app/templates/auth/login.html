<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CodeLucid | Secure Authentication</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="brand-logo">
                <svg width="48" height="48" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="32" height="32" rx="8" fill="#0D0F14" stroke="#7C9060" stroke-width="1.5"/>
                    <path d="M11 10C9.34315 10 8 11.3431 8 13V19C8 20.6569 9.34315 22 11 22H14" stroke="#7C9060" stroke-width="2" stroke-linecap="round"/>
                    <path d="M18 10V22H23" stroke="#7C9060" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </div>
            <h2 style="text-align: center; margin-bottom: 8px;">Enter Workspace</h2>
            <p style="text-align: center; color: var(--text-muted); margin-bottom: 24px;">Global engineering access.</p>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <p style="color: var(--error); font-size: 14px;">{{ message }}</p>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('auth.login') }}">
                <label style="font-size: 13px; color: var(--text-muted);">Email Address</label>
                <input type="email" name="email" required autofocus placeholder="engineer@domain.com">
                <button type="submit" class="btn-primary">Authenticate</button>
            </form>
        </div>
    </div>
</body>
</html>
